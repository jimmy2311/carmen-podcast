name: Archive Carmen podcast audio
on:
  workflow_dispatch:
  push:
    paths:
      - audio_sources.json
      - download_audio.py
      - .github/workflows/archive-audio.yml
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download narration and studio tracks
        run: python3 download_audio.py
      - name: Publish downloaded audio
        run: |
          git config user.name "Carmen Podcast Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/ audio-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Carmen podcast MP3 recordings"
            git push
          fi
